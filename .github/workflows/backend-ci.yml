name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # backend requirements are needed too: backend.api.routes imports
        # FastAPI/SciPy/Pillow, not just the scraper's numpy+astropy.
        run: pip install -r backend/requirements.txt -r scripts/requirements-scrape.txt -r requirements-dev.txt
      - name: Compile and import check
        run: |
          python -m compileall -q backend scripts
          python -c "import backend.config, backend.storage, backend.api.routes"
          python scripts/scraper.py --help
          python scripts/download_data.py --help
          python scripts/scrape_timeline.py --help
      - name: Tests
        run: python -m pytest -q
