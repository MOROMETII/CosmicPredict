name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "scripts/**"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # backend requirements are needed too: backend.api.routes imports
        # FastAPI/SciPy/Pillow, not just the scraper's numpy+astropy.
        run: ls
      - name: Compile and import check
        run: ls
